# Event notifier (SPEC-001, ADR-0008): consumer group `event-notifier` reads commerce.events.v1 and
# data.ingest.v1 and sends Telegram messages for payment.intent.succeeded and failed/rejected intakes.
# Runs after the intake (:53) and knowledge (:55) relays, so a relayed event is acted on the same hour.
#
# Public repository: GitHub-hosted runner and a public log, so the result holds counts and an error
# class only. Failures reach Telegram through the uptime Worker heartbeat `event-notifier`.
name: Notify (Kafka → Telegram)

on:
  # Scheduled by the jobs queue (platform-jobs-worker job `event-notifier`, cron "58 * * * *" UTC).
  workflow_dispatch:
    inputs:
      source:
        description: "who started the run"
        type: choice
        options: [manual, jobs-queue]
        default: manual

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install from uv.lock
        run: |
          python -m pip install --disable-pip-version-check uv==0.13.1
          uv sync --frozen --no-dev

      - name: Notify
        id: notify
        env:
          NOTIFIER_KAFKA_BOOTSTRAP: ${{ secrets.NOTIFIER_KAFKA_BOOTSTRAP }}
          NOTIFIER_KAFKA_CA_PEM: ${{ secrets.NOTIFIER_KAFKA_CA_PEM }}
          NOTIFIER_KAFKA_USERNAME: ${{ secrets.NOTIFIER_KAFKA_USERNAME }}
          NOTIFIER_KAFKA_PASSWORD: ${{ secrets.NOTIFIER_KAFKA_PASSWORD }}
          NOTIFIER_TELEGRAM_BOT_TOKEN: ${{ secrets.NOTIFIER_TELEGRAM_BOT_TOKEN }}
          NOTIFIER_TELEGRAM_CHAT_ID: ${{ secrets.NOTIFIER_TELEGRAM_CHAT_ID }}
        run: |
          set +e
          .venv/bin/event-notifier run > "$RUNNER_TEMP/notify.json" 2> "$RUNNER_TEMP/notify.err"
          code=$?
          set -e
          # stdout is counts + an error class only; stderr stays out of the public log.
          jq . "$RUNNER_TEMP/notify.json" | tee -a "$GITHUB_STEP_SUMMARY" || echo "notify: no result (exit $code)"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"

      - name: Heartbeat
        if: ${{ always() }}
        env:
          HEARTBEAT_TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
          CODE: ${{ steps.notify.outputs.exit_code }}
        run: |
          if [ "$CODE" = "0" ]; then body='{"ok":true,"failed":[]}'; else body='{"ok":false,"failed":["notify"]}'; fi
          echo "heartbeat: $body"
          curl -fsS -X POST https://monitor.bookchaowalit.com/heartbeat/event-notifier \
            -H "Authorization: Bearer $HEARTBEAT_TOKEN" -H "Content-Type: application/json" -d "$body"
          [ "$CODE" = "0" ]
